# ==============================================================================
# Dependabot Configuration: Consolidated Grouped Dependency Updates
# ==============================================================================
version: 2
updates:
  # ----------------------------------------------------------------------------
  # NPM Workspace Monorepo
  # ----------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      all-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      all-majors:
        patterns:
          - "*"
        update-types:
          - "major"
    # Prevent breaking framework rewrites from opening noise PRs
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "🤖 chore(deps)"

  # ----------------------------------------------------------------------------
  # GitHub Actions Workflows (Consolidated into 1 PR)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "🤖 chore(actions)"

  # ----------------------------------------------------------------------------
  # OpenTofu / Terraform Providers (Cloudflare Provider)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "terraform"
    directory: "/infra/tofu"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "🤖 chore(tofu)"

  # ----------------------------------------------------------------------------
  # Docker Container Base Images (Consolidated into 1 PR)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-docker:
        patterns:
          - "*"
    commit-message:
      prefix: "🤖 chore(docker)"

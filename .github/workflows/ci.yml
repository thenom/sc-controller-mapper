name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Build & Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript packages and web bundle
        run: npm run build

  unit-and-component-tests:
    name: Vitest Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage gate (≥85% statements/branches/functions/lines)
        run: npm test -- --coverage

  docker-smoke-test:
    name: Docker Container Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-stage Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sc-controller-mapper:smoke

  secret-and-credential-scan:
    name: Secret & Credential Leak Prevention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Audit Tracked Files for Sensitive Extensions
        run: |
          chmod +x ./scripts/block-sensitive-files.sh
          git ls-files | xargs ./scripts/block-sensitive-files.sh

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  opentofu-validation:
    name: OpenTofu Format & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Format Check
        run: tofu fmt -check
        working-directory: infra/tofu

      - name: OpenTofu Init
        run: tofu init -backend=false
        working-directory: infra/tofu

      - name: OpenTofu Validate
        run: tofu validate
        working-directory: infra/tofu

  go-daemon-build:
    name: Go Extraction Daemon (sc-daemon) Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'daemon/go.mod'

      - name: Build Go Extraction Daemon
        run: go build -v -o bin/sc-daemon main.go
        working-directory: daemon

      - name: Run Go Unit Tests with coverage reporting
        run: go test -v -cover ./...
        working-directory: daemon

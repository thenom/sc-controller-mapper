name: Playwright E2E UX Gate

on:
  pull_request:
    types: [labeled, synchronize]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional live URL (e.g. Cloudflare Pages preview) to test against'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ux-gate:
    name: Playwright UX Validation
    # Only run if triggered manually OR if the PR carries the 'run-e2e' label
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build TypeScript packages and web bundle
        run: npm run build

      - name: Run Playwright E2E Test Suite
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.inputs.target_url || '' }}

      - name: Upload Playwright Test Report & Traces on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

services:
  sc-controller-mapper:
    build:
      context: .
      dockerfile: Dockerfile
    image: sc-controller-mapper:latest
    container_name: sc-controller-mapper
    restart: unless-stopped
    ports:
      # Port mapped for direct private server access or router NAT forwarding
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
